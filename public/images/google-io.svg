<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" width="820" height="600">
  <defs>
    <linearGradient id="bg-gio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a1f" />
      <stop offset="100%" stop-color="#242831" />
    </linearGradient>
  </defs>

  <rect width="820" height="600" fill="url(#bg-gio)" rx="16" />

  <!-- Google Color Brackets Graphic -->
  <g transform="translate(570, 160)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M30 40 L-10 80 L30 120" stroke="#4285f4" />
    <path d="M110 40 L150 80 L110 120" stroke="#ea4335" />
    <circle cx="70" cy="80" r="22" stroke="#fbbc05" />
    <line x1="45" y1="135" x2="95" y2="25" stroke="#34a853" />
  </g>

  <!-- Badge -->
  <rect x="60" y="70" width="140" height="36" rx="18" fill="#4285f4" fill-opacity="0.2" stroke="#4285f4" stroke-width="1.5" />
  <text x="86" y="93" fill="#4285f4" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">KEYNOTE</text>

  <!-- Title -->
  <text x="60" y="220" fill="#ffffff" font-family="system-ui, sans-serif" font-size="56" font-weight="800">Google I/O</text>
  <text x="60" y="285" fill="#34a853" font-family="system-ui, sans-serif" font-size="56" font-weight="800">Extended 2026</text>

  <text x="60" y="345" fill="#a4b0c0" font-family="system-ui, sans-serif" font-size="20">AI, Android, Web &amp; Cloud developer announcements.</text>

  <!-- Info Bar -->
  <rect x="60" y="460" width="700" height="70" rx="12" fill="#20242b" stroke="#313742" stroke-width="1.5" />
  <text x="90" y="502" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="600">📅 MAY 20 - 22, 2026</text>
  <text x="360" y="502" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="600">📍 MOUNTAIN VIEW, CA</text>
  <text x="640" y="502" fill="#34a853" font-family="system-ui, sans-serif" font-size="18" font-weight="700">FREE</text>
</svg>
