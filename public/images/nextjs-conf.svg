<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" width="820" height="600">
  <defs>
    <linearGradient id="bg-next" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="50%" stop-color="#111111" />
      <stop offset="100%" stop-color="#1a1a1a" />
    </linearGradient>
    <linearGradient id="glow-next" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0070f3" />
      <stop offset="100%" stop-color="#f50057" />
    </linearGradient>
  </defs>

  <rect width="820" height="600" fill="url(#bg-next)" rx="16" />
  
  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="150" x2="820" y2="150" />
    <line x1="0" y1="300" x2="820" y2="300" />
    <line x1="0" y1="450" x2="820" y2="450" />
    <line x1="205" y1="0" x2="205" y2="600" />
    <line x1="410" y1="0" x2="410" y2="600" />
    <line x1="615" y1="0" x2="615" y2="600" />
  </g>

  <!-- Glowing Next.js 'N' Logo Graphic -->
  <g transform="translate(560, 140)">
    <circle cx="90" cy="90" r="110" fill="#0070f3" fill-opacity="0.15" />
    <circle cx="90" cy="90" r="70" stroke="#0070f3" stroke-width="3" fill="none" />
    <path d="M65 50V130L125 130" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M65 50L115 120" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" />
  </g>

  <!-- Badge -->
  <rect x="60" y="70" width="130" height="36" rx="18" fill="#0070f3" fill-opacity="0.2" stroke="#0070f3" stroke-width="1.5" />
  <text x="92" y="93" fill="#0070f3" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">CONFERENCE</text>

  <!-- Title -->
  <text x="60" y="220" fill="#ffffff" font-family="system-ui, sans-serif" font-size="56" font-weight="800">Next.js Conf</text>
  <text x="60" y="285" fill="url(#glow-next)" font-family="system-ui, sans-serif" font-size="56" font-weight="800">2026 Edition</text>

  <text x="60" y="345" fill="#a1a1a1" font-family="system-ui, sans-serif" font-size="20">The global developer event for React &amp; Next.js.</text>

  <!-- Info Bar -->
  <rect x="60" y="460" width="700" height="70" rx="12" fill="#1c1c1c" stroke="#333333" stroke-width="1.5" />
  <text x="90" y="502" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="600">📅 OCT 24, 2026</text>
  <text x="360" y="502" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="600">📍 SAN FRANCISCO &amp; ONLINE</text>
  <text x="640" y="502" fill="#0070f3" font-family="system-ui, sans-serif" font-size="18" font-weight="700">FREE</text>
</svg>
