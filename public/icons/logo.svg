      <stop offset="0%" stop-color="#59deca" />
      <stop offset="100%" stop-color="#94eaff" />
    </linearGradient>
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182830" />
